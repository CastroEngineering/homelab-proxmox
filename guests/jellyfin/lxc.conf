arch: amd64
cores: 2
features: nesting=1
hostname: jellyfin
memory: 4048
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.0.1,hwaddr=X,ip=X,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-100-disk-0,size=16G
swap: 512
unprivileged: 1
lxc.idmap: u 0 100000 200000
lxc.idmap: g 0 100000 200000
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
